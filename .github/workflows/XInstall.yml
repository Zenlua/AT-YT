name: YT-EXT
on:
  schedule:
    - cron: '0/5 * * * *'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Example: 19.44.39'
        required: false
        default: 'Auto'
      DEVICE:
        description: 'Select device'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64
      DEV:
        description: 'Tool cli'
        required: false
        default: 'Stable'
        type: choice
        options:
          - Stable
          - Develop
      FEATURE:
        description: 'Turn off feature'
        required: false
        default: ''
permissions: write-all
env:
    GH_TOKEN: ${{ github.token }}
jobs:
  build1:
    name: 'Buid arm64 root'
    if: github.repository == 'Zenlua/AT-YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Autu"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$DEV" ] || DEV="Stable"
          [ "$TYPE" ] || TYPE="true"
          . .github/install.sh
          . .github/XYT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-EXT ${{ env.VER }} ${{ env.Kad }}
          tag_name: X${{ env.V }}${{ env.VER }}
          files: Up/*
          body_path: Log.txt
          overwrite: true
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: Update
          tag_name: Up
          files: Up*.json
          prerelease: true
          overwrite: true
  build2:
    name: 'Buid arm64 no-root'
    if: github.repository == 'Zenlua/AT-YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'false'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Autu"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$DEV" ] || DEV="Stable"
          [ "$TYPE" ] || TYPE="false"
          . .github/install.sh
          . .github/XYT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-EXT ${{ env.VER }} ${{ env.Kad }}
          tag_name: X${{ env.V }}${{ env.VER }}
          files: Up/*
          body_path: Log.txt
          overwrite: true
  build3:
    name: 'Buid arm64 amoled root'
    if: github.repository == 'Zenlua/AT-YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'true'
          AMOLED: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Autu"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$DEV" ] || DEV="Stable"
          [ "$TYPE" ] || TYPE="true"
          [ "$AMOLED" ] || AMOLED="true"
          . .github/install.sh
          . .github/XYT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-EXT ${{ env.VER }} ${{ env.Kad }}
          tag_name: X${{ env.V }}${{ env.VER }}
          files: Up/*
          body_path: Log.txt
          overwrite: true
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: Update
          tag_name: Up
          files: Up*.json
          prerelease: true
          overwrite: true
  build4:
    name: 'Buid arm64 amoled no-root'
    if: github.repository == 'Zenlua/AT-YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'false'
          AMOLED: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Autu"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$DEV" ] || DEV="Stable"
          [ "$TYPE" ] || TYPE="false"
          [ "$AMOLED" ] || AMOLED="true"
          . .github/install.sh
          . .github/XYT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: YT-EXT ${{ env.VER }} ${{ env.Kad }}
          tag_name: X${{ env.V }}${{ env.VER }}
          files: Up/*
          body_path: Log.txt
          overwrite: true
