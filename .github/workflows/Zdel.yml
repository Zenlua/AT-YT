name: Delete
on:
  schedule:
    - cron: '* * 1 * *'  
  workflow_dispatch:     
jobs:
  delete_old_releases:
    runs-on: ubuntu-latest
    steps:
    - name: Delete old releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 28  # Giữ lại 10 bản mới nhất
        delete_tags: true  # Xoá cả tag Git tương ứng
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
