name: Delete
on:
  schedule:
    - cron: '* * 1 * *'  
  workflow_dispatch:     
jobs:
  delete_old_releases:
    runs-on: ubuntu-latest
    steps:
    - name: Delete old releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 28
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
