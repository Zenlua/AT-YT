name: YT-AT MorpheApp

on:
  schedule:
    - cron: '59 23 * * *'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Example: 19.47.53'
        required: false
        default: 'Auto'
      DEVICE:
        description: 'Select device'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64
      CLI:
        description: 'Tool cli'
        required: false
        default: 'MorpheApp/morphe-cli'
      PATCH:
        description: 'Tool patch'
        required: false
        default: 'MorpheApp/morphe-patches'
      FEATURE:
        description: 'Turn on/off feature on: -e "feature", off: -d "feature"'
        required: false
        default: '-d "Custom branding"'
      UPTG:
        description: 'Send telegram'
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # BẮT BUỘC: Cài đặt JDK 21 để tránh lỗi UnsupportedClassVersionError (Class 65.0)
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cài đặt Android SDK tools nếu cần thiết
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Tải các công cụ CLI và Patches dựa trên repo được chọn
      - name: Download Morphe Tools
        run: |
          CLI_REPO="${{ inputs.CLI || 'MorpheApp/morphe-cli' }}"
          PATCH_REPO="${{ inputs.PATCH || 'MorpheApp/morphe-patches' }}"
          
          # Tải CLI mới nhất
          CLI_URL=$(curl -s "https://api.github.com/repos/$CLI_REPO/releases/latest" | grep "browser_download_url.*jar" | cut -d : -f 2,3 | tr -d \")
          curl -sL $CLI_URL -o morphe-cli.jar

          # Tải Patches mới nhất
          PATCH_URL=$(curl -s "https://api.github.com/repos/$PATCH_REPO/releases/latest" | grep "browser_download_url.*morphe" | cut -d : -f 2,3 | tr -d \")
          curl -sL $PATCH_URL -o morphe-patches.morphe

      # Bước thực thi Patch
      - name: Run Patch Process
        run: |
          java -jar morphe-cli.jar patch \
            -m morphe-patches.morphe \
            ${{ inputs.FEATURE }} \
            --out "YouTube-patched.apk" \
            "YouTube-base.apk"

      # Tải APK sau khi patch lên Github Artifacts
      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Morphe-${{ inputs.DEVICE }}
          path: YouTube-patched.apk

      # Gửi qua Telegram nếu tích chọn UPTG
      - name: Send Telegram Notification
        if: ${{ inputs.UPTG == true }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -F chat_id="$TELEGRAM_TO" \
               -F document=@"YouTube-patched.apk" \
               -F caption="Build YT-AT MorpheApp hoàn tất!" \
               "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"
