name: YT build
on:
  schedule:
    - cron: '20 23 1/9 * *'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Example: 19.47.53'
        required: false
        default: 'Auto'
      DEVICE:
        description: 'Select device'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64
      CLI:
        description: 'Tool cli'
        required: false
        default: 'revanced/revanced-cli'
      PATCH:
        description: 'Tool patch'
        required: false
        default: 'revanced/revanced-patches'
      FEATURE:
        description: 'Turn on/off feature on: [-e "feature"], off: [-d "feature"]'
        required: false
        default: ''
permissions: write-all
env:
    GH_TOKEN: ${{ github.token }}
    VERSION: ${{ inputs.VERSION }}
    DEVICE: ${{ inputs.DEVICE }}
    GITPCLI: ${{ inputs.CLI }}
    GITPATCH: ${{ inputs.PATCH }}
    FEATURE: ${{ inputs.FEATURE }}
jobs:
  build1:
    name: 'Buid Root'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: See build
        env:
          TYPE: 'true'
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Auto"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$GITPCLI" ] || GITPCLI="revanced/revanced-cli"
          [ "$GITPATCH" ] || GITPATCH="revanced/revanced-patches"
          [ "$TYPE" ] || TYPE="true"
          . .github/build.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-RE ${{ env.VER }} ${{ env.Kad }}"
          tag_name: "K${{ env.V }}${{ env.VER }}"
          files: Up/*
          body_path: "change.txt"
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: "Update"
          tag_name: "Up"
          files: Up*.json
          prerelease: true
  build2:
    name: 'Buid No-root'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: See build
        env:
          TYPE: 'false'
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Auto"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$GITPCLI" ] || GITPCLI="revanced/revanced-cli"
          [ "$GITPATCH" ] || GITPATCH="revanced/revanced-patches"
          [ "$TYPE" ] || TYPE="false"
          . .github/build.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-RE ${{ env.VER }} ${{ env.Kad }}"
          tag_name: "K${{ env.V }}${{ env.VER }}"
          files: Up/*
  build3:
    name: 'Buid Amoled Root'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: See build
        env:
          TYPE: 'true'
          AMOLED: 'true'
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Auto"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$GITPCLI" ] || GITPCLI="revanced/revanced-cli"
          [ "$GITPATCH" ] || GITPATCH="revanced/revanced-patches"
          [ "$TYPE" ] || TYPE="true"
          [ "$AMOLED" ] || AMOLED="true"
          . .github/build.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-RE ${{ env.VER }} ${{ env.Kad }}"
          tag_name: "K${{ env.V }}${{ env.VER }}"
          files: Up/*
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: "Update"
          tag_name: "Up"
          files: Up*.json
          prerelease: true
  build4:
    name: 'Buid Amoled No-root'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: See build
        env:
          TYPE: 'false'
          AMOLED: 'true'
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Auto"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$GITPCLI" ] || GITPCLI="revanced/revanced-cli"
          [ "$GITPATCH" ] || GITPATCH="revanced/revanced-patches"
          [ "$TYPE" ] || TYPE="false"
          [ "$AMOLED" ] || AMOLED="true"
          . .github/build.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-RE ${{ env.VER }} ${{ env.Kad }}"
          tag_name: "K${{ env.V }}${{ env.VER }}"
          files: Up/*
