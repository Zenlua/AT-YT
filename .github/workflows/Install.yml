name: YT-RE
on:
  schedule:
    - cron: '20 23 1/2 * *'
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Example: 19.47.53'
        required: false
        default: 'Auto'
      DEVICE:
        description: 'Select device'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64
      DEV:
        description: 'Tool cli'
        required: false
        default: 'Stable'
        type: choice
        options:
          - Stable
          - Develop
      FEATURE:
        description: 'Turn on/off feature on: [-e "feature"], off: [-d "feature"]'
        required: false
        default: ''
permissions: write-all
env:
    GH_TOKEN: ${{ github.token }}
jobs:
  build1:
    name: 'Buid Root'
    if: github.repository == 'Zenlua/AT-YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Autu"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$DEV" ] || DEV="Stable"
          [ "$TYPE" ] || TYPE="true"
          . .github/install.sh
          . .github/YT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-RE ${{ env.VER }} ${{ env.Kad }}"
          tag_name: "K${{ env.V }}${{ env.VER }}"
          files: Up/*
          body: "${{ env.BODY }}"
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: "Update"
          tag_name: "Up"
          files: Up*.json
          prerelease: true
  build2:
    name: 'Buid No-root'
    if: github.repository == 'Zenlua/AT-YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'false'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Autu"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$DEV" ] || DEV="Stable"
          [ "$TYPE" ] || TYPE="false"
          . .github/install.sh
          . .github/YT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-RE ${{ env.VER }} ${{ env.Kad }}"
          tag_name: "K${{ env.V }}${{ env.VER }}"
          files: Up/*
  build3:
    name: 'Buid Amoled Root'
    if: github.repository == 'Zenlua/AT-YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'true'
          AMOLED: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Autu"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$DEV" ] || DEV="Stable"
          [ "$TYPE" ] || TYPE="true"
          [ "$AMOLED" ] || AMOLED="true"
          sleep 10
          . .github/install.sh
          . .github/YT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-RE ${{ env.VER }} ${{ env.Kad }}"
          tag_name: "K${{ env.V }}${{ env.VER }}"
          files: Up/*
      - name: Upload Json
        uses: softprops/action-gh-release@v2
        with:
          name: "Update"
          tag_name: "Up"
          files: Up*.json
          prerelease: true
  build4:
    name: 'Buid Amoled No-root'
    if: github.repository == 'Zenlua/AT-YT' && github.ref == 'refs/heads/Vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: See build
        env:
          VERSION: ${{ inputs.VERSION }}
          DEVICE: ${{ inputs.DEVICE }}
          DEV: ${{ inputs.DEV }}
          TYPE: 'false'
          AMOLED: 'true'
          FEATURE: ${{ inputs.FEATURE }}
        run: |
          # kakathic
          [ "$VERSION" ] || VERSION="Autu"
          [ "$DEVICE" ] || DEVICE="arm64-v8a"
          [ "$DEV" ] || DEV="Stable"
          [ "$TYPE" ] || TYPE="false"
          [ "$AMOLED" ] || AMOLED="true"
          sleep 10
          . .github/install.sh
          . .github/YT.sh
      - name: Upload File
        uses: softprops/action-gh-release@v2
        with:
          name: "YT-RE ${{ env.VER }} ${{ env.Kad }}"
          tag_name: "K${{ env.V }}${{ env.VER }}"
          files: Up/*
          
